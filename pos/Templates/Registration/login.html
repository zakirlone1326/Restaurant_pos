<!DOCTYPE html>
<html>
<head>
    <title>KOSHUR POS | LOGIN</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 24px; width: 350px; color: #0f172a; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .brand { font-weight: 800; font-size: 1.5rem; margin-bottom: 20px; }
        .brand span { color: #f97316; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { background: #f97316; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">KOSHUR <span>POS</span></div>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>

            
        </form>
    </div>
</body>
</html>
