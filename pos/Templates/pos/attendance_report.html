<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Report | KOSHUR POS</title>
    <style>
        :root { --saffron: #f97316; --dark: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background: #f1f5f9; }
        .report-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #f8fafc; padding: 12px; color: #64748b; text-transform: uppercase; font-size: 0.7rem; }
        td { padding: 15px 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        .status-present { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>
    <div class="report-card">
        <h2 style="margin-top:0;">Attendance Report</h2>
        <table>
            <thead>
                <tr>
                    <th>Employee</th>
                    <th>Date</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for record in attendance_records %}
                <tr>
                    <td><strong>{{ record.employee.name }}</strong></td>
                    <td>{{ record.date }}</td>
                    <td>{{ record.check_in|time:"H:i" }}</td>
                    <td>{{ record.check_out|time:"H:i"|default:"--" }}</td>
                    <td class="status-present">PRESENT</td>
                </tr>
                {% empty %}
                <tr><td colspan="5" style="text-align:center;">No records found for this period.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
